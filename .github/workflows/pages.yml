name: Deploy ParUp smoke test to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Run interaction checks
        run: npm test

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site files
        run: |
          mkdir -p _site
          cp index.html styles.css site.js manifest.webmanifest CNAME _site/
          cp -R assets _site/assets
      - name: Upload static site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact metadata
        run: sleep 10
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
