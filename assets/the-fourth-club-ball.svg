<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 132 132" role="img" aria-label="Four golf clubs over a pink golf ball">
  <defs>
    <radialGradient id="ball-shell" cx="31%" cy="23%" r="83%">
      <stop offset="0" stop-color="#ff9fbb"/>
      <stop offset=".58" stop-color="#ff5f87"/>
      <stop offset="1" stop-color="#df285f"/>
    </radialGradient>
    <radialGradient id="ball-shine" cx="28%" cy="18%" r="66%">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ball-dimples" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.1" fill="#ad204f" opacity=".18"/>
      <circle cx="12" cy="12" r="2.1" fill="#ad204f" opacity=".18"/>
      <circle cx="4" cy="3.4" r="1.1" fill="#fff" opacity=".2"/>
      <circle cx="12" cy="11.4" r="1.1" fill="#fff" opacity=".2"/>
    </pattern>
    <clipPath id="ball-clip"><circle cx="64" cy="64" r="60"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="61" fill="#d8285d"/>
  <circle cx="64" cy="64" r="60" fill="url(#ball-shell)"/>
  <circle cx="64" cy="64" r="60" fill="url(#ball-dimples)" clip-path="url(#ball-clip)"/>
  <circle cx="64" cy="64" r="60" fill="url(#ball-shine)"/>
  <g stroke="#17141f" stroke-linecap="round" stroke-linejoin="round">
    <!-- Three white clubs and the taller pink one, with the heads facing left. -->
    <g fill="none">
      <path d="M39 62 25 123" stroke-width="12"/><path d="M39 62 25 123" stroke="#fffdf8" stroke-width="6"/>
      <path d="M61 34 47 123" stroke-width="12"/><path d="M61 34 47 123" stroke="#fffdf8" stroke-width="6"/>
      <path d="M82 66 69 123" stroke-width="12"/><path d="M82 66 69 123" stroke="#fffdf8" stroke-width="6"/>
      <path d="M106 22 92 123" stroke-width="13"/><path d="M106 22 92 123" stroke="#ff5f87" stroke-width="7"/>
    </g>
    <!-- Head fills are separate from the open contour strokes below, leaving each sole unoutlined. -->
    <g fill="#fffdf8" stroke="none">
      <path d="M7 57 C14 52 27 54 42 59 Q45 60 43 64 L20 73 C14 75 8 72 6 67 Q4 61 7 57Z"/>
      <path d="M27 31 C27 23 34 18 45 17 C54 16 63 20 65 27 Q66 33 61 38 L48 44 L33 40 Q27 38 27 31Z"/>
      <path d="M53 57 C61 51 75 51 86 57 Q91 60 87 65 L68 76 C61 79 54 75 52 69 Q50 62 53 57Z"/>
    </g>
    <g fill="none" stroke-width="4">
      <path d="M8 57 C15 52 28 54 42 59"/>
      <path d="M7 58 C3 62 5 70 13 73"/>
      <path d="M27 31 C27 23 34 18 45 17 C54 16 63 20 65 27 Q66 33 61 38"/>
      <path d="M53 57 C61 51 75 51 86 57 Q91 60 87 65"/>
      <path d="M53 58 C49 62 51 72 61 77"/>
    </g>
    <path d="M78 13 C77 5 85 0 96 0 C107 0 116 6 117 15 Q118 23 111 29 L96 36 L84 29 Q78 24 78 13Z" fill="#ff5f87" stroke="none"/>
    <path d="M78 13 C77 5 85 0 96 0 C107 0 116 6 117 15 Q118 23 111 29 L96 36" fill="none" stroke="#17141f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
