<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 132 132" role="img" aria-label="Four golf clubs over a pink golf ball">
  <defs>
    <radialGradient id="ball-shell" cx="31%" cy="23%" r="83%">
      <stop offset="0" stop-color="#ff9fbb"/>
      <stop offset=".58" stop-color="#ff5f87"/>
      <stop offset="1" stop-color="#df285f"/>
    </radialGradient>
    <radialGradient id="ball-shine" cx="28%" cy="18%" r="66%">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ball-dimples" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.1" fill="#ad204f" opacity=".18"/>
      <circle cx="12" cy="12" r="2.1" fill="#ad204f" opacity=".18"/>
      <circle cx="4" cy="3.4" r="1.1" fill="#fff" opacity=".2"/>
      <circle cx="12" cy="11.4" r="1.1" fill="#fff" opacity=".2"/>
    </pattern>
    <clipPath id="ball-clip"><circle cx="64" cy="64" r="60"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="61" fill="#d8285d"/>
  <circle cx="64" cy="64" r="60" fill="url(#ball-shell)"/>
  <circle cx="64" cy="64" r="60" fill="url(#ball-dimples)" clip-path="url(#ball-clip)"/>
  <circle cx="64" cy="64" r="60" fill="url(#ball-shine)"/>

  <!-- Four distinct club silhouettes fan out above the ball: three irons and a taller driver. -->
  <g stroke="#17141f" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke-width="12">
      <path d="M39 59 25 123"/><path d="M61 35 47 123"/><path d="M83 62 69 123"/>
      <path d="M105 26 92 123" stroke-width="13"/>
    </g>
    <g fill="none" stroke="#fffdf8" stroke-width="6">
      <path d="M39 59 25 123"/><path d="M61 35 47 123"/><path d="M83 62 69 123"/>
    </g>
    <path d="M105 26 92 123" fill="none" stroke="#ff5f87" stroke-width="7"/>

    <!-- Iron faces point left. The lower sole edge is intentionally left open. -->
    <g fill="#fffdf8" stroke="none">
      <path d="M8 52 Q9 44 18 43 L34 44 Q42 45 47 52 L44 59 Q37 66 22 65 L12 62 Q7 59 8 52Z"/>
      <path d="M31 28 Q32 19 42 17 L57 18 Q66 19 70 26 L66 34 Q60 41 46 41 L36 38 Q30 35 31 28Z"/>
      <path d="M53 56 Q55 48 64 47 L80 48 Q89 49 94 56 L90 63 Q83 70 68 69 L58 66 Q52 63 53 56Z"/>
    </g>
    <g fill="none" stroke-width="3.5">
      <path d="M8 52 Q9 44 18 43 L34 44 Q42 45 47 52"/>
      <path d="M8 52 Q6 59 12 62"/>
      <path d="M31 28 Q32 19 42 17 L57 18 Q66 19 70 26 L66 34"/>
      <path d="M53 56 Q55 48 64 47 L80 48 Q89 49 94 56"/>
      <path d="M53 56 Q51 63 58 66"/>
    </g>
    <!-- Small face grooves help the irons read as clubs at larger sizes. -->
    <g fill="none" stroke="#17141f" stroke-width="1.5" opacity=".7">
      <path d="m12 49 11 2 M11 53l11 2 M11 57l10 2"/>
      <path d="m35 25 10 1 M34 29l10 1 M34 33l9 1"/>
      <path d="m57 53 11 2 M56 57l11 2 M56 61l10 2"/>
    </g>

    <!-- Driver: a single rounded, broad head with the shaft joining at its heel. -->
    <path d="M79 12 C77 5 83 1 93 1 L105 2 C114 3 120 9 119 16 C118 23 112 28 103 30 L88 27 C82 25 79 20 79 12Z" fill="#ff5f87" stroke="none"/>
    <path d="M79 12 C77 5 83 1 93 1 L105 2 C114 3 120 9 119 16 C118 23 112 28 103 30" fill="none" stroke="#17141f" stroke-width="4"/>
  </g>
</svg>
