<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="The Fourth Club pink golf ball">
  <defs>
    <radialGradient id="shell" cx="31%" cy="23%" r="83%">
      <stop offset="0" stop-color="#ff9fbb"/>
      <stop offset=".58" stop-color="#ff5f87"/>
      <stop offset="1" stop-color="#df285f"/>
    </radialGradient>
    <radialGradient id="shine" cx="28%" cy="18%" r="66%">
      <stop offset="0" stop-color="#fff" stop-opacity=".43"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dimples" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.1" fill="#ad204f" opacity=".18"/>
      <circle cx="12" cy="12" r="2.1" fill="#ad204f" opacity=".18"/>
      <circle cx="4" cy="3.4" r="1.1" fill="#fff" opacity=".18"/>
      <circle cx="12" cy="11.4" r="1.1" fill="#fff" opacity=".18"/>
    </pattern>
    <clipPath id="ballClip"><circle cx="64" cy="64" r="60"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="61" fill="#d8285d"/>
  <circle cx="64" cy="64" r="60" fill="url(#shell)"/>
  <circle cx="64" cy="64" r="60" fill="url(#dimples)" clip-path="url(#ballClip)"/>
  <circle cx="64" cy="64" r="60" fill="url(#shine)"/>
  <text x="64" y="84" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="59" font-weight="700" letter-spacing="-3">4</text>
</svg>
