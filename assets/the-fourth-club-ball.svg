<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Four golf clubs over a pink golf ball">
  <defs>
    <filter id="clubs-only" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncA type="gamma" amplitude="1" exponent="5" offset="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <!-- Use the approved ball artwork untouched; the generated club illustration is a separate layer. -->
  <image href="roundfolk-pink-golf-ball.png" width="128" height="128"/>
  <image href="the-fourth-club-clubs.png" x="21.3" width="85.4" height="128" filter="url(#clubs-only)"/>
</svg>
